version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: saas_audit_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_auditor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saas_audit_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: saas_audit_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/health_auditor
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=saas-audit-tool-jwt-token-secret-1234
      - GITHUB_CLIENT_ID=dummy_id
      - GITHUB_CLIENT_SECRET=dummy_secret
      - GITHUB_REDIRECT_URI=http://localhost:3000/auth/github/callback
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: saas_audit_worker
    command: python worker.py
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/health_auditor
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: saas_audit_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
